<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>La Web Inútil - Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #121212; color: #e0e0e0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .login-container { background: #1e1e1e; padding: 40px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.7); width: 350px; text-align: center; border: 1px solid #333; }
        h2 { color: #ffcc00; margin-bottom: 20px; font-size: 24px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 13px; color: #aaa; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; border: 1px solid #444; border-radius: 6px; background: #2a2a2a; color: #fff; font-size: 14px; transition: border 0.3s; }
        input:focus { border-color: #ffcc00; outline: none; }
        button { width: 100%; padding: 12px; background: #ffcc00; color: #121212; border: none; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; transition: background 0.3s; }
        button:hover { background: #e6b800; }
        .links { margin-top: 20px; font-size: 13px; }
        .links a { color: #8ab4f8; text-decoration: none; }
        .links a:hover { text-decoration: underline; }
        .easter-egg { position: fixed; bottom: 15px; left: 15px; font-size: 12px; color: #444; cursor: pointer; user-select: none; transition: color 0.3s; }
        .easter-egg:hover { color: #ffcc00; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>🔒 La Web Inútil</h2>
        <form id="loginForm">
            <div class="input-group">
                <label for="username">Nombre de usuario</label>
                <input type="text" id="username" placeholder="Tu usuario del patio" required>
            </div>
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit">Acceder</button>
        </form>
        <div class="links">
            <a href="/code">Entrar con código de un solo uso</a>
        </div>
    </div>

    <div class="easter-egg" onclick="getFreeCoins()">🎁 [Easter Egg Inútil]</div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (res.ok && data.success) {
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    window.location.href = '/home';
                } else {
                    window.location.href = '/401';
                }
            } catch (err) {
                alert('Error crítico de conexión con el servidor.');
            }
        });

        function getFreeCoins() {
            alert('¡Felicidades! Has descubierto el secreto público y ganado tus primeras Inútil Coins 🪙');
        }
    </script>
</body>
</html>
