<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Código de un solo uso - La Web Inútil</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #121212; color: #e0e0e0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .card { background: #1e1e1e; padding: 40px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.7); width: 360px; text-align: center; border: 1px solid #333; }
        h2 { color: #4CAF50; margin-bottom: 10px; font-size: 22px; }
        p { font-size: 13px; color: #aaa; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 12px; color: #aaa; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; border: 1px solid #444; border-radius: 6px; background: #2a2a2a; color: #fff; font-size: 14px; }
        input:focus { border-color: #4CAF50; outline: none; }
        button { width: 100%; padding: 12px; background: #4CAF50; color: #fff; border: none; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        button:hover { background: #45a049; }
        .back { margin-top: 15px; font-size: 13px; }
        .back a { color: #8ab4f8; text-decoration: none; }
        .back a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h2>⚡ Configuración Owner</h2>
        <p>Introduce el código de un solo uso (45567) para inicializar la cuenta principal.</p>
        <form id="ownerForm">
            <div class="input-group">
                <label for="code">Código de acceso</label>
                <input type="text" id="code" placeholder="Ej. 45567" required>
            </div>
            <div class="input-group">
                <label for="username">Usuario Owner</label>
                <input type="text" id="username" placeholder="Nombre de administrador principal" required>
            </div>
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit">Crear Cuenta Owner</button>
        </form>
        <div class="back">
            <a href="/">Volver al Login principal</a>
        </div>
    </div>

    <script>
        document.getElementById('ownerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const code = document.getElementById('code').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            try {
                const res = await fetch('/api/register-owner', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code, username, password })
                });

                const data = await res.json();
                if (res.ok && data.success) {
                    alert('¡Cuenta Owner creada correctamente! Ya puedes iniciar sesión.');
                    window.location.href = '/';
                } else {
                    alert(data.message || 'Código inválido o ya utilizado previamente.');
                }
            } catch (err) {
                alert('Error de red al procesar el código.');
            }
        });
    </script>
</body>
</html>
