<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Código de un solo uso - La Web Inútil</title>
    <style>
        body { background: #121212; color: #fff; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); width: 320px; text-align: center; border: 1px solid #333; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 6px; background: #2a2a2a; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #4CAF50; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #45a049; }
    </style>
</head>
<body>
    <div class="card">
        <h2>⚡ Cuenta Owner</h2>
        <p style="font-size: 13px; color: #aaa;">Introduce el código 45567 para crear tu cuenta de propietario.</p>
        <form id="ownerForm">
            <input type="text" id="code" placeholder="Código (ej. 45567)" required>
            <input type="text" id="username" placeholder="Nuevo Usuario Owner" required>
            <input type="password" id="password" placeholder="Nueva Contraseña" required>
            <button type="submit">Crear Cuenta Owner</button>
        </form>
        <p style="margin-top: 15px;"><a href="/" style="color: #aaa; font-size: 13px; text-decoration: none;">Volver al Login</a></p>
    </div>
    <script>
        document.getElementById('ownerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const code = document.getElementById('code').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            try {
                const res = await fetch('/api/register-owner', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code, username, password })
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    alert('¡Cuenta Owner creada con éxito! Ahora inicia sesión.');
                    window.location.href = '/';
                } else {
                    alert(data.message || 'Código inválido o ya utilizado.');
                }
            } catch (err) {
                alert('Error al conectar con el servidor.');
            }
        });
    </script>
</body>
</html>
